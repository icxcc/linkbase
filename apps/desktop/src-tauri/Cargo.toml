[workspace]
members = [
    "crates/core",
    "crates/db-common",
    "crates/drivers/sqlite-driver",
    ".",
]
resolver = "2"

[package]
name = "linkbase"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "linkbase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
linkbase-core = { path = "crates/core" }
db-common = { path = "crates/db-common" }
