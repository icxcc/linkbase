[package]
name = "linkbase-core"
version = "0.1.0"
edition = "2021"

[dependencies]
db-common = { path = "../db-common" }
sqlite-driver = { path = "../drivers/sqlite-driver" }
mysql-driver = { path = "../drivers/mysql-driver" }
postgres-driver = { path = "../drivers/postgres-driver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
