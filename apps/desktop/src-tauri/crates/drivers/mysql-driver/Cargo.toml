[package]
name = "mysql-driver"
version = "0.1.0"
edition = "2021"

[dependencies]
db-common = { path = "../../db-common" }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "mysql"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
